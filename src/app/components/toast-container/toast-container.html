<div class="fixed top-4 right-4 z-50 flex w-72 flex-col gap-2">
  @for (notificacion of notificacionService.notificaciones(); track notificacion.id) {
    <div
      class="flex items-start justify-between gap-3 rounded-lg px-4 py-3 text-sm text-white shadow-lg"
      [class.bg-emerald-600]="notificacion.tipo === 'exito'"
      [class.bg-red-600]="notificacion.tipo === 'error'"
      [class.bg-slate-700]="notificacion.tipo === 'info'"
    >
      <span>{{ notificacion.mensaje }}</span>

      <button
        type="button"
        class="font-bold opacity-70 hover:opacity-100"
        (click)="notificacionService.eliminar(notificacion.id)"
      >
        ×
      </button>
    </div>
  }
</div>
