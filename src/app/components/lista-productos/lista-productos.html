<div>
  <main class="max-w-7xl mx-auto p-6 lg:p-10">
    <app-producto-filtro
      [texto]="textoBusqueda()"
      [equipo]="equipo()"
      (textoCambio)="alBuscar($event)"
      (equipoCambio)="alCambiarEquipo($event)"
    />

    <div class="mt-6 mb-6 flex flex-wrap items-baseline justify-between gap-3">
      <h2 class="text-2xl font-bold text-slate-800">Nuestros jerseys</h2>

      @if (!cargando()) {
        <p class="text-sm text-slate-500">
          Mostrando {{ desde() }}-{{ hasta() }} de {{ total() }}
        </p>
      }
    </div>

    <!-- Tres estados: cargando, sin resultados, con resultados -->
    @if (cargando()) {
      <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        @for (i of skeletons; track i) {
          <app-skeleton-card />
        }
      </section>
    } @else if (productos().length === 0) {
      <div class="bg-white rounded-2xl py-12 px-6 text-center">
        <p class="text-slate-500">
          Ningun jersey coincide con la busqueda.
        </p>
        <button
          type="button"
          class="mt-4 px-5 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-slate-700"
          (click)="limpiarBusqueda(); alCambiarEquipo('')"
        >
          Ver todos
        </button>
      </div>
    } @else {
      <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        @for (producto of productos(); track producto.id) {
          <app-product-card
            [id]="producto.id"
            [nombre]="producto.nombre"
            [equipo]="producto.equipo"
            [abrev]="producto.abrev"
            [precio]="producto.precio"
            [imagen]="producto.imagen"
            [stock]="producto.stock"
            [esFavorito]="favoritosService.esFavorito(producto.id)"
            (addToCart)="manejarAgregarAlCarrito($event)"
            (toggleFavorito)="manejarToggleFavorito($event)"
          />
        }
      </section>
    }

    <app-paginacion
      [pagina]="paginaActual()"
      [totalPaginas]="totalPaginas()"
      (cambioPagina)="alCambiarPagina($event)"
    />
  </main>
</div>
